<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인터랙티브 유형 보기</title>
<style>
:root{--ink:#1d2433;--sub:#5b6478;--line:#dfe4ee;--bg:#eef2f8;--card:#fff;--blue:#2f6fe4;--teal:#13a089;--yellow:#f5b400;--red:#e24b4b;--ok:#0a8f5b;--hl:#fff1b8;--chip:#eef3ff;--orange:#f7931e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8ecf4;--sub:#a9b2c4;--line:#39404f;--bg:#141821;--card:#1f2430;--chip:#2a3550;--hl:#4a3f12}}
:root[data-theme="dark"]{--ink:#e8ecf4;--sub:#a9b2c4;--line:#39404f;--bg:#141821;--card:#1f2430;--chip:#2a3550;--hl:#4a3f12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Pretendard","Malgun Gothic",system-ui,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px 10px}
.hin{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
header h1{margin:0;font-size:20px;letter-spacing:-.3px}
header .sub{color:var(--sub);font-size:13px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.filters button,.helpbtn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 12px;cursor:pointer}
.filters button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
main{max-width:1240px;margin:0 auto;padding:12px 16px 60px}
h2.grp{font-size:15px;color:var(--sub);margin:22px 4px 10px;font-weight:800;letter-spacing:.5px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.type{min-width:0}.type.hide{display:none}
.cap{display:flex;align-items:center;gap:8px;margin:0 4px 6px}
.code{font-weight:900;font-size:15px}.name{color:var(--sub);font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;flex:none}.dot.ok{background:#22b36b}.dot.mid{background:#f0b400}.dot.no{background:#e24b4b}
.ibtn{font:inherit;font-size:12px;font-weight:800;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:2px 10px;cursor:pointer;flex:none}
.ibtn:hover{border-color:var(--blue);color:var(--blue)}
/* 화면(프로토타입 모양) */
.screen{background:linear-gradient(#d6ebfb,#f1f8fe);border-radius:16px;padding:10px 12px 8px;box-shadow:0 2px 0 rgba(0,0,0,.04),0 8px 24px rgba(30,50,90,.08);display:flex;flex-direction:column;gap:7px;min-height:360px;color:#1d2433}
.top{display:flex;align-items:center;gap:6px}
.top i{width:26px;height:26px;border-radius:50%;background:var(--orange);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;color:#fff}
.rwd{margin-left:auto;display:flex;align-items:center;gap:6px;background:#fff;border-radius:99px;padding:1px 10px 1px 3px;font-size:11px;font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rwd b{background:#e8463a;color:#fff;border-radius:99px;padding:0 8px}.rwd.on b{background:#0a8f5b}
.qbar{background:var(--blue);color:#fff;border-radius:10px;padding:5px 10px;text-align:center;font-weight:800;font-size:14px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.stage{flex:1;background:#fff;border:2px solid #1d2433;border-radius:12px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;position:relative;min-height:230px}
.bot{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:800;color:#1d2433}
.bot .pg{border:1.5px solid #1d2433;border-radius:6px;padding:0 6px;background:#fff}.bot .dots2 i{display:inline-block;width:7px;height:7px;border-radius:50%;border:1.5px solid #1d2433;margin:0 2px;background:#fff}.bot .dots2 i.on{background:var(--orange)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.btn,.opt,.chip{font:inherit;cursor:pointer;border:2px solid #1d2433;background:#fff;color:#1d2433;border-radius:10px;padding:5px 13px;font-weight:800;font-size:14px}
.opt:hover,.chip:hover{background:#f6f8fc}
.opt.sel,.chip.sel{background:var(--hl)}.opt.right{background:#d8f5e5;border-color:var(--ok)}.opt.wrong{background:#fde2e2;border-color:var(--red)}
.chip{background:var(--chip);border-radius:99px;padding:3px 13px;touch-action:none;color:#1d2433}.chip.used{opacity:.3;pointer-events:none}
.ctl{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;align-items:center}
.ctl .re{font:inherit;font-size:11px;border:1px solid #c9d0dc;background:#fff;border-radius:99px;padding:1px 8px;cursor:pointer;color:#5b6478}
.ctl .ok{width:34px;height:34px;border-radius:50%;border:none;background:var(--blue);color:#fff;font-size:17px;font-weight:900;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.fb{min-height:20px;font-weight:800;font-size:13px;text-align:center}.fb.ok{color:var(--ok)}.fb.no{color:var(--red)}
.fig{font-weight:900;font-size:22px;background:#fff7dc;border:1px solid #e6c96a;border-radius:10px;padding:5px 14px;text-align:center}
.fig.s{font-size:15px;padding:3px 10px}
.pic{width:112px;height:76px;border:2px solid #1d2433;border-radius:10px;background:#fff7dc;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;text-align:center;line-height:1.2;cursor:pointer;flex-direction:column;color:#1d2433}
.pic small{font-size:10px;font-weight:600;color:#7b8496}
.slot{display:inline-flex;min-width:84px;min-height:30px;border:2px dashed #8a93a6;border-radius:8px;vertical-align:middle;align-items:center;justify-content:center;padding:0 8px;margin:0 3px;background:#f7f9fc;font-weight:800}
.slot.fill{border-style:solid;border-color:var(--blue);background:#eaf1ff}
.bins{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.bin{min-width:150px;min-height:78px;border:2.5px solid #1d2433;border-radius:14px;padding:5px;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;justify-content:center}
.bin b{width:100%;text-align:center;font-size:14px}.bin.a{background:#fff3d6}.bin.b{background:#dcecff}
.sent{font-size:16px;font-weight:700;line-height:2.1;text-align:center}
.word{cursor:pointer;border-radius:6px;padding:1px 3px}.word.sel{background:var(--hl);outline:2px solid var(--yellow)}.word.right{background:#d8f5e5}
.pad{position:relative;border:2px solid #1d2433;border-radius:10px;background:#fff}
.pad canvas{display:block;touch-action:none;cursor:crosshair}
.pad .ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;color:#d4d9e3;pointer-events:none;letter-spacing:6px}
.cells{display:flex;gap:4px}
.say{display:flex;align-items:center;gap:10px;border:2px solid #1d2433;border-radius:10px;padding:4px 10px;background:#fff;font-weight:800;min-width:240px;max-width:100%;justify-content:space-between}
.round{width:30px;height:30px;border-radius:50%;border:none;background:var(--blue);color:#fff;font-size:14px;cursor:pointer}
.dots i{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid #1d2433;margin-left:3px}.dots i.on{background:var(--yellow)}
.lt{position:relative;display:flex;gap:80px;justify-content:center}.lt .col{display:flex;flex-direction:column;gap:9px}.lt svg{position:absolute;inset:0;pointer-events:none;overflow:visible}.lt .opt{white-space:normal;max-width:200px}
.card{width:112px;height:76px;perspective:400px;cursor:pointer}.card .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}.card.flip .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;border:2px solid #1d2433;text-align:center;font-size:13px;padding:4px;color:#1d2433}
.card .f{background:var(--teal);color:#fff;font-size:15px}.card .b{background:#eafaf5;transform:rotateY(180deg)}
.card.done .f,.card.done .b{border-color:var(--ok)}
.bub{position:relative;background:#fff;border:2px solid #1d2433;border-radius:14px;padding:5px 12px;font-weight:700;max-width:340px}
.who{width:42px;height:42px;border-radius:50%;background:#e6f8ec;border:2px solid #1d2433;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.rec{display:flex;align-items:center;gap:8px;background:#f2735f;border-radius:10px;padding:5px 10px;color:#fff;font-weight:800;font-size:13px;flex-wrap:wrap}
.rec button{font:inherit;border:none;border-radius:99px;padding:3px 11px;cursor:pointer;font-weight:800}
.coin{display:none}
.tip{font-size:11px;color:#7b8496}
.pop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border:2px solid #1d2433;border-radius:12px;padding:10px 14px;max-width:300px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:2;font-size:13px}
/* 설명 창 */
.ov{position:fixed;inset:0;background:rgba(15,20,30,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}.ov.on{display:flex}
.sheet{background:var(--card);color:var(--ink);border-radius:16px;max-width:680px;width:100%;max-height:88vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet h3{margin:0 0 2px;font-size:19px}.sheet .nm{color:var(--sub);margin-bottom:12px}
.sheet dl{display:grid;grid-template-columns:92px 1fr;gap:6px 10px;margin:0 0 12px}.sheet dt{color:var(--sub);font-size:13px}.sheet dd{margin:0}
.sheet .sb{overflow-x:auto;font-size:12px}.sheet table{border-collapse:collapse;min-width:100%}.sheet td,.sheet th{border:1px solid var(--line);padding:3px 7px;white-space:nowrap}.sheet th{background:var(--chip)}
.sheet img{max-width:100%;border-radius:8px;border:1px solid var(--line);margin-top:6px;background:#000}
.sheet .x{float:right;font:inherit;border:none;background:none;font-size:22px;cursor:pointer;color:var(--sub)}
.badge{font-size:12px;border-radius:99px;padding:1px 9px;font-weight:800}.b-ok{background:#e3f6ec;color:#0a6b3d}.b-mid{background:#fff4d6;color:#7a5600}.b-no{background:#fde8e8;color:#9b1c1c}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}.filters{margin-left:0}}
@media (max-width:520px){.lt{gap:26px}.lt .opt{max-width:40vw}.screen{min-height:0;padding:8px}.say{min-width:0;flex-wrap:wrap}.card,.pic{width:96px}}
</style>
</head>
<body>
<header><div class="hin">
  <h1>인터랙티브 유형 보기</h1><span class="sub">업체 상호작용 유형을 7차시 소인수분해 낱말로 만든 실제 화면 · 눌러서 해 보고, <b>ⓘ 설명</b>으로 자세히</span>
  <button class="helpbtn" id="help">이 페이지는?</button>
  <div class="filters" id="filters"></div>
</div></header>
<main id="list"></main>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<script>
const IMG = {};
// ── 공용 도우미 ──────────────────────────────────────────
const $ = (s, r = document) => r.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const speak = (t, done) => { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = 0.9; if (done) u.onend = done; speechSynthesis.speak(u); } catch (e) { done && done(); } };
// SB 규칙의 채점: 기회 = 보기 수 − 1(최대 3번)
function judge(box, nOpt, coinTxt) {
  const tries = Math.max(1, Math.min(3, (nOpt || 2) - 1)); let used = 0, over = false;
  const fb = el('div', 'fb'); box.append(fb);
  const coin = { classList: { add: () => box.closest('.screen').querySelector('.rwd').classList.add('on'), remove: () => box.closest('.screen').querySelector('.rwd').classList.remove('on') } };
  return {
    tries, reset() { used = 0; over = false; fb.textContent = ''; fb.className = 'fb'; coin.classList.remove('on'); },
    check(ok, showAnswer) {
      if (over) return true;
      if (ok) { fb.textContent = '참 잘했어요!'; fb.className = 'fb ok'; over = true; coin.classList.add('on'); return true; }
      used++;
      if (used >= tries) { fb.textContent = '정답을 확인해 보세요.'; fb.className = 'fb no'; over = true; showAnswer && showAnswer(); return true; }
      fb.textContent = `한 번 더 풀어볼까요? (남은 기회 ${tries - used}번)`; fb.className = 'fb no'; return false;
    }, msg(t, ok) { fb.textContent = t; fb.className = 'fb ' + (ok ? 'ok' : ''); }, coin() { coin.classList.add('on'); }
  };
}
// 손글씨 판
function pad(w, h, ghost, size) {
  const p = el('div', 'pad'); p.style.width = w + 'px'; p.style.height = h + 'px';
  if (ghost) { const g = el('div', 'ghost', ghost); g.style.fontSize = (size || Math.min(h * .62, w / Math.max(1, ghost.length) * .9)) + 'px'; p.append(g); }
  const c = el('canvas'); c.width = w * 2; c.height = h * 2; c.style.width = w + 'px'; c.style.height = h + 'px'; p.append(c);
  const x = c.getContext('2d'); x.scale(2, 2); x.lineWidth = 5; x.lineCap = 'round'; x.strokeStyle = '#1d2433'; let on = false, n = 0;
  const pos = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  c.onpointerdown = e => { on = true; c.setPointerCapture(e.pointerId); const [a, b] = pos(e); x.beginPath(); x.moveTo(a, b); };
  c.onpointermove = e => { if (!on) return; const [a, b] = pos(e); x.lineTo(a, b); x.stroke(); n++; };
  c.onpointerup = () => { on = false; };
  p.clear = () => { x.clearRect(0, 0, w, h); n = 0; }; p.strokes = () => n; return p;
}
// 끌어 놓기(눌러서 고른 뒤 눌러 놓기도 됨): chips → targets(slot/bin)
function dnd(chips, targets, onDrop) {
  let pick = null;
  chips.forEach(c => {
    c.draggable = true; c.ondragstart = e => { e.dataTransfer.setData('text', c.dataset.v); pick = c; };
    c.onclick = () => { chips.forEach(o => o.classList.remove('sel')); if (pick === c) { pick = null; return; } pick = c; c.classList.add('sel'); };
  });
  targets.forEach(t => {
    t.ondragover = e => e.preventDefault();
    t.ondrop = e => { e.preventDefault(); if (pick) onDrop(pick, t); pick = null; chips.forEach(o => o.classList.remove('sel')); };
    t.onclick = () => { if (pick) { onDrop(pick, t); pick = null; chips.forEach(o => o.classList.remove('sel')); } };
  });
}
function checkRow(box, onCheck, onReset) {
  const st = box.closest('.stage'); const r = el('div', 'ctl');
  if (onReset) { const re = el('button', 're', '↺ 다시'); re.onclick = onReset; r.append(re); }
  const ok = el('button', 'ok', '↵'); ok.title = '확인'; ok.onclick = onCheck; r.append(ok); st.append(r);
}
// 선 잇기(왼쪽 → 오른쪽)
function lines(box, left, right, answer, coinTxt) {
  const lt = el('div', 'lt'), L = el('div', 'col'), R = el('div', 'col'); const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); const map = {}; let cur = null;
  const draw = () => { svg.innerHTML = ''; const br = lt.getBoundingClientRect(); for (const i in map) { const a = L.children[i].getBoundingClientRect(), b = R.children[map[i]].getBoundingClientRect(); const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line'); ln.setAttribute('x1', a.right - br.left); ln.setAttribute('y1', a.top + a.height / 2 - br.top); ln.setAttribute('x2', b.left - br.left); ln.setAttribute('y2', b.top + b.height / 2 - br.top); ln.setAttribute('stroke', '#2f6fe4'); ln.setAttribute('stroke-width', '4'); svg.append(ln); } };
  left.forEach((t, i) => { const b = typeof t === 'string' ? el('button', 'opt', t) : t; b.onclick = () => { cur = i; [...L.children].forEach((c, k) => c.classList.toggle('sel', k === i)); }; L.append(b); });
  right.forEach((t, j) => { const b = typeof t === 'string' ? el('button', 'opt', t) : t; b.onclick = () => { if (cur == null) return; for (const k in map) if (map[k] === j) delete map[k]; map[cur] = j; cur = null; [...L.children].forEach(c => c.classList.remove('sel')); draw(); }; R.append(b); });
  lt.append(L, R, svg); box.append(lt); const j = judge(box, left.length, coinTxt);
  checkRow(box, () => j.check(answer.every((a, i) => map[i] === a), () => { answer.forEach((a, i) => map[i] = a); draw(); }), () => { for (const k in map) delete map[k]; draw(); j.reset(); });
  new ResizeObserver(draw).observe(lt);
}
// 녹음(마이크) — 브라우저가 허락하지 않으면 안내만
function recorder(box, label) {
  const r = el('div', 'rec'); const b = el('button', '', '🎙 ' + (label || '녹음')); const pl = el('button', '', '▶ 들어 보기'); pl.disabled = true; const st = el('span', '', '');
  let mr = null, chunks = [], url = null;
  b.onclick = async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try { const s = await navigator.mediaDevices.getUserMedia({ audio: true }); mr = new MediaRecorder(s); chunks = []; mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => { s.getTracks().forEach(t => t.stop()); url = URL.createObjectURL(new Blob(chunks)); pl.disabled = false; b.textContent = '🎙 다시 녹음'; st.textContent = '녹음했어요'; box.closest('.screen').querySelector('.rwd').classList.add('on'); };
      mr.start(); b.textContent = '■ 멈추기'; st.textContent = '녹음 중…';
    } catch (e) { st.textContent = '(이 브라우저에서는 마이크를 쓸 수 없어요 — 실제 콘텐츠에서는 녹음됩니다)'; box.closest('.screen').querySelector('.rwd').classList.add('on'); }
  };
  pl.onclick = () => { if (url) new Audio(url).play(); };
  r.append(b, pl, st); box.append(r);
  const coin = el('div', 'coin', '🪙 말하기 1점'); box.closest('.stage').append(coin);
}
const sayRow = (text, read, dots = true) => { const s = el('div', 'say'); let n = 0; const d = el('span', 'dots', '<i></i><i></i>'); const b = el('button', 'round', '🔊');
  b.onclick = () => speak(read || text.replace(/<[^>]+>/g, ''), () => { n = Math.min(2, n + 1); [...d.children].forEach((x, i) => x.classList.toggle('on', i < n)); });
  s.append(el('span', '', text), el('span', 'row', ''), dots ? d : el('span')); s.children[1].append(b); return s; };
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);

// ── 유형 목록 ──────────────────────────────────────────
// s: ok/mid/no, ours: 우리 틀 화면·원고 도우미, stage: 쓰는 단계, use: 판단, sb: 스토리보드 칸 [F, G, 보기[], 정답, 기회, 보상]
const T = [
 {code:'쓰기1', g:'쓰기', name:'연필을 눌러 글씨 쓰기(AI 쓰기)', v:'연필 클릭해 글씨 써보기 · 예: 정답 ‘학교’, 기회 3번, 쓰기 1점', s:'ok', ours:'ocr 손글씨 · handwrite(\'낱말\')', stage:'연습하기', use:'씀 — 필수어휘 하나만(10/18 결정)', img:'00_쓰기1',

 click13(b){ const r = el('div','row'); ['★ 소인수분해','거듭제곱'].forEach((w, i) => { const x = el('button','btn', w + ' <span style="font-size:13px">🔊</span>'); x.style.cssText = 'font-size:22px;padding:10px 20px;' + (i ? '' : 'background:#fff1b8'); x.onclick = () => speak(w.replace('★ ','')); r.append(x); }); b.append(el('div','row','<span class="who">🌱</span><span class="bub">이번 시간에는 ‘소인수분해’와 ‘거듭제곱’에 대해 배우겠습니다.</span>')); b.append(r); },
 click14(b){ const P = [['소인수분해','6 = 2 × 3'],['거듭제곱','2 × 2 × 2 = 2³']]; const cards = shuffle(P.flatMap(([a, c], k) => [[a, k], [c, k]])); const r = el('div','row'); let open = []; let done = 0; const j = judge(b,4);
   cards.forEach(([t, k]) => { const c = el('div','card'); c.innerHTML = `<div class="in"><div class="f">?</div><div class="b">${t}</div></div>`; c.onclick = () => { if (c.classList.contains('flip') || open.length === 2) return; c.classList.add('flip'); open.push([c, k]); if (open.length === 2) { const [[c1, k1], [c2, k2]] = open; setTimeout(() => { if (k1 === k2) { c1.classList.add('done'); c2.classList.add('done'); done++; if (done === P.length) j.check(true); } else { c1.classList.remove('flip'); c2.classList.remove('flip'); j.msg('다시 찾아보세요.'); } open = []; }, 700); } }; r.append(c); }); b.prepend(r); },

 rec2(b){ const s = el('div','sent','2³은 2의 '); const sl = el('span','slot',''); s.append(sl, document.createTextNode('입니다.')); b.append(s); const r = el('div','row'); ['소인수분해','거듭제곱'].forEach(w => { const x = el('button','opt', w); x.onclick = () => { sl.textContent = w; sl.classList.add('fill'); if (w === '거듭제곱') { fb.textContent = '맞아요! 이제 문장 전체를 말해 보세요.'; fb.className = 'fb ok'; rw.style.display = ''; } else { fb.textContent = '한 번 더 풀어볼까요?'; fb.className = 'fb no'; } }; r.append(x); }); b.append(r); const fb = el('div','fb'); b.append(fb); const rw = el('div'); rw.style.display = 'none'; b.append(rw); recorder(rw, '문장 말하기'); },
 rec3(b){ const t = el('div','bub','12를 소인수분해하시오.<br>2 × 2 × 2를 거듭제곱으로 나타내시오.'); t.style.cssText += ';background:#fffaf0;border-color:#a37a00;max-width:420px'; b.append(el('div','row','<span style="font-size:12px;font-weight:800;background:#7a5c00;color:#fff;border-radius:6px;padding:1px 8px">교과서</span>'), t); recorder(b, '읽고 녹음'); },

function alertLike(b, t) { let f = b.querySelector('.fb'); if (!f) { f = el('div','fb'); b.append(f); } f.textContent = t; f.className = 'fb'; }

// ── 그리기: 화면 카드(프로토타입 모양) + ⓘ 설명 창 ──────────────
const SN = { ok: ['b-ok','✅ 틀에 있음'], mid: ['b-mid','△ 비슷하게'], no: ['b-no','✗ 없음'] };
const GN = { '쓰기': '쓰기', '드래그': '드래그 앤 드롭', '클릭': '클릭', '녹음': '녹음', '추가': '추가' };
const list = $('#list'); let grid = null, grp = '';
const ov = $('#ov'), sheet = $('#sheet'); ov.onclick = e => { if (e.target === ov) ov.classList.remove('on'); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') ov.classList.remove('on'); });
function open(html) { sheet.innerHTML = '<button class="x" aria-label="닫기">×</button>' + html; sheet.querySelector('.x').onclick = () => ov.classList.remove('on'); ov.classList.add('on'); sheet.scrollTop = 0; }
function explain(t) {
  const sb = t.sb; const imgs = [];
  if (IMG[t.img] && !t.img.startsWith('2025')) imgs.push(['원고집필 템플릿 예시', IMG[t.img]]);
  if (IMG['2025_' + t.code]) imgs.push(['2025 수학 실제 화면', IMG['2025_' + t.code]]);
  open(`<h3>${t.code} <span class="badge ${SN[t.s][0]}">${SN[t.s][1]}</span></h3><div class="nm">${t.name}</div>
   <dl><dt>업체 설명</dt><dd>${t.v}</dd><dt>우리 틀</dt><dd>${t.ours}</dd><dt>쓰는 단계</dt><dd>${t.stage}</dd><dt>판단</dt><dd><b>${t.use}</b></dd><dt>규칙</dt><dd>기회 = 보기 수 − 1(최대 3번) · 보상: 이 화면의 보상 칸</dd></dl>
   <div class="sb"><b>스토리보드 시트에 적기</b> (페이지 첫 행은 ‘화면’ 행)<table><tr><th>F 내용</th><th>G</th>${sb[2].map((x, i) => `<th>보기${i + 1}</th>`).join('')}<th>정답</th><th>기회</th><th>보상</th></tr>
   <tr><td>지시문</td><td colspan="${sb[2].length + 4}">${t.q}</td></tr><tr><td>${sb[0]}</td><td>${sb[1]}</td>${sb[2].map(x => `<td>${x}</td>`).join('')}<td>${String(sb[3]).replace(/\n/g, '<br>')}</td><td>${sb[4]}</td><td>${sb[5]}</td></tr></table></div>
   ${imgs.map(([n, src]) => `<p style="margin:14px 0 0;font-weight:800">업체 그림 — ${n}</p><img src="${src}" alt="">`).join('')}`);
}
$('#help').onclick = () => open(`<h3>이 페이지는?</h3><div class="nm">원고를 쓸 때 “이 내용을 어떤 유형으로 만들까?”를 고르는 데 씁니다.</div>
  <dl><dt>화면</dt><dd>업체 원고집필 템플릿 ‘참고_인터렉티브’ 시트의 유형과 2025 수학 화면에만 있는 유형(쓰기8·드래그8-2·클릭13·14)을 7차시 소인수분해 낱말로 만든 실제 동작 화면입니다. 누르고, 끌고, 쓰고, 말해 볼 수 있어요.</dd>
  <dt>ⓘ 설명</dt><dd>업체 설명, 우리 틀 지원, 쓰는 단계, 판단, 스토리보드 시트에 적는 법${Object.keys(IMG).length ? ', 업체 예시 그림' : ''}</dd>
  <dt>점 색</dt><dd><span class="dot ok" style="display:inline-block"></span> 틀에 있음 · <span class="dot mid" style="display:inline-block"></span> 비슷하게 · <span class="dot no" style="display:inline-block"></span> 없음(새로 만들어야 함)</dd>
  <dt>공통 규칙</dt><dd>기회 = 보기 수 − 1(최대 3번). 틀리면 “한 번 더 풀어볼까요?”, 기회를 다 쓰면 “정답을 확인해 보세요.”, 맞히면 “참 잘했어요!”(보상 막대가 초록으로)</dd>
  <dt>참고</dt><dd>${Object.keys(IMG).length ? '업체 예시 그림은 사업 내부 자료라 이 공개 판에서는 뺐습니다.' : '업체 예시 그림은 사업 내부 자료라 이 공개 판에서는 뺐습니다.'}</dd></dl>`);
T.forEach(t => {
  if (t.g !== grp) { grp = t.g; list.append(el('h2', 'grp', GN[grp] || grp)); grid = el('div', 'grid'); list.append(grid); }
  const card = el('section', 'type'); card.id = 't-' + t.code; card.dataset.s = t.s; card.dataset.g = t.g;
  const cap = el('div', 'cap', `<span class="dot ${t.s}" title="${SN[t.s][1]}"></span><span class="code">${t.code}</span><span class="name">${t.name}</span>`);
  const ib = el('button', 'ibtn', 'ⓘ 설명'); ib.onclick = () => explain(t); cap.append(ib); card.append(cap);
  const scr = el('div', 'screen');
  scr.innerHTML = `<div class="top"><i>⚙</i><i>🌐</i><i>🔊</i><span class="rwd"><b>★ 0</b>👄👓👂✏️</span></div>`;

const F = [['all','전체'],['ok',DOT('ok') + '틀에 있음'],['mid',DOT('mid') + '비슷하게'],['no',DOT('no') + '없음'],['쓰기','쓰기'],['드래그','드래그'],['클릭','클릭'],['녹음','녹음']];
F.forEach(([k, n], i) => { const b = el('button', i ? '' : 'on', n); b.onclick = () => { [...$('#filters').children].forEach(x => x.classList.remove('on')); b.classList.add('on');
  document.querySelectorAll('.type').forEach(c => c.classList.toggle('hide', !(k === 'all' || c.dataset.s === k || c.dataset.g === k)));
  document.querySelectorAll('h2.grp').forEach(h => { const g = h.nextElementSibling; h.style.display = g.querySelector('.type:not(.hide)') ? '' : 'none'; }); }; $('#filters').append(b); });
